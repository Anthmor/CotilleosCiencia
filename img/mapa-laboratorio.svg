<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#e2e8f0" />
  <!-- Zona 1: Rectangulo izquierdo -->
  <rect x="20" y="40" width="160" height="220" rx="8" fill="#0f172a" />
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">FÍSICA</text>
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">Ver artículo</text>
  <!-- Zona 2: Circulo central -->
  <circle cx="300" cy="150" r="80" fill="#0284c7" />
  <text x="300" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">DISPUTAS</text>
  <text x="300" y="170" font-family="Arial, sans-serif" font-size="12" fill="#fef08a" text-anchor="middle">Ver tabla</text>
  <!-- Zona 3: Triangulo (poligono) derecho -->
  <polygon points="420,260 500,40 580,260" fill="#1e293b" />
  <text x="500" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">TU CASO</text>
  <text x="500" y="210" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">Participar</text>
</svg>